<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación de San Valentín</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: url('https://images.pexels.com/photos/6800204/pexels-photo-6800204.jpeg') no-repeat center center fixed;
            background-size: cover;
            text-align: center;
            color: white;
        }
        .container {
            margin-top: 15vh;
            background: rgba(0, 0, 0, 0.6);
            padding: 20px;
            border-radius: 15px;
        }
        .gif-container img {
            width: 150px;
        }
        .footer-gif img {
            width: 110px;
        }
        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
            position: relative;
        }
        .btn-custom {
            background-color: pink;
            border-color: pink;
            color: black;
            width: 150px;
        }
        .btn-custom:hover {
            background-color: #ff69b4;
            border-color: #ff69b4;
        }
        #btn-no {
            position: relative;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="gif-container">
            <img src="gif/blow-kiss-kiss.gif" alt="Blow Kiss">
        </div>
        <h4><i>Mi niña hermosa, Karla Vanessa...</i></h4>
        <h1>¿Me harías el honor de ser mi San Valentín? ❤️</h1>
        <div class="btn-container">
            <a href="pagina-destino.html" class="btn btn-custom btn-lg">Sí</a>
            <button id="btn-no" class="btn btn-custom btn-lg">No</button>
        </div>
        <div class="footer-gif mt-3">
            <img src="gif/amor-love.gif" alt="Amor Love">
        </div>
    </div>
    <script>
        document.getElementById("btn-no").addEventListener("mouseover", function() {
            let screenWidth = window.innerWidth;
            let screenHeight = window.innerHeight;
            let buttonWidth = this.offsetWidth;
            let buttonHeight = this.offsetHeight;
            
            let maxX = screenWidth - buttonWidth - 20;
            let maxY = screenHeight - buttonHeight - 20;
            
            let x = Math.random() * maxX;
            let y = Math.random() * maxY;
            
            this.style.position = "absolute";
            this.style.left = x + "px";
            this.style.top = y + "px";
        });
    </script>
</body>
</html>
